argv:
- --output-dir
- /kaggle/working/run2
- --batch-size
- '16'
- --config
- configs/train_run2.yaml
- --data-root
- /kaggle/input/datasets/<owner>/veridoc-data/data
- --encoder-weights
- imagenet
- --amp
